<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domine - Dashboard de Projetos</title>
    <link rel="stylesheet" href="stylesindex.css"> 
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo-group">
                <img src="img/logo.png" alt="Domine Logo" class="logo-img">
                <div class="logo-text">Domine</div>
            </div>
            
    <nav class="nav-menu">
    <ul>
        <li class="active"><a href="#">Dashboard</a></li>
        <li><a href="projetos.html">Projetos</a></li> 
        <li><a href="feedback.html">Comunicação</a></li> 
    </ul>
</nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1>Dashboard de Gerenciamento</h1>
                <div class="user-area">
                    <input type="text" placeholder="Pesquisar projetos, tarefas..." class="search-bar">
                    <div class="user-profile">Olá, Usuário!</div>
                </div>
            </header>

            <section class="content-area">
                <h2>Visão Geral do Domine</h2>
                
                <div class="card-grid">
                    <div class="card metric-card">
                        <h3>Projetos Ativos</h3>
                        <p>12</p>
                    </div>
                    <div class="card metric-card">
                        <h3>Tarefas em Aberto</h3>
                        <p>45</p>
                    </div>
                    <div class="card metric-card">
                        <h3>Prazo Próximo</h3>
                        <p>3</p>
                    </div>
                </div>

                </section>
        </main>
    </div>
     <footer>
    <p>© 2025 Domine — Todos os direitos reservados.</p>
  </footer>
</body>
</html>
